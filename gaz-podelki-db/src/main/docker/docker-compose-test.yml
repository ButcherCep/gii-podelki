version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: gaz-podelki-postgres-test
    environment:
      - POSTGRES_DB=gaz_podelki_test
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - gaz-podelki-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d gaz_podelki_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
    driver: local

networks:
  gaz-podelki-test-network:
    driver: bridge