version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gaz-podelki-postgres
    environment:
      POSTGRES_DB: gaz_podelki
      POSTGRES_USER: gaz_user
      POSTGRES_PASSWORD: gaz_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaz_user -d gaz_podelki"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gaz-podelki-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@gaz-podelki.ru
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "8081:80"
    networks:
      - gaz-podelki-network
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  gaz-podelki-network:
    driver: bridge